<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Buildin Task Panel · Demo</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172126;
        background: #f6f8f7;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 24px;
      }

      .panel {
        width: min(100%, 440px);
        min-height: 520px;
        margin: 0 auto;
        padding: 27px 25px 24px;
        border: 1px solid #e5ebe8;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 16px 50px rgb(35 61 50 / 7%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 27px;
        color: #5e7167;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .09em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: inline-grid;
        width: 19px;
        height: 19px;
        place-items: center;
        border-radius: 6px;
        background: #177953;
        color: #fff;
        font-size: 13px;
        letter-spacing: 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 31px;
        line-height: 1.05;
        letter-spacing: -.05em;
      }

      .subtitle {
        margin: 8px 0 0;
        color: #829087;
        font-size: 13px;
      }

      .count {
        padding: 6px 10px;
        border-radius: 999px;
        background: #edf5f0;
        color: #24744e;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 58px;
        padding: 10px 0;
        border-bottom: 1px solid #edf0ee;
        background: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }

      li:last-child { border-bottom: 0; }

      .check {
        display: grid;
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        place-items: center;
        margin-top: 2px;
        border: 1.7px solid #b9c8be;
        border-radius: 50%;
        background: #fff;
        color: transparent;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease, transform .15s ease;
      }

      .check:hover { border-color: #177953; transform: scale(1.05); }
      .check:focus-visible, .add:focus-visible, #new-task:focus-visible { outline: 3px solid #8fd5ab; outline-offset: 2px; }

      .check[aria-pressed="true"] {
        border-color: #177953;
        background: #177953;
        color: #fff;
      }

      .check svg { width: 15px; height: 15px; }

      .task-text { min-width: 0; padding-top: 3px; }
      .task-name { display: block; font-size: 15px; font-weight: 560; line-height: 1.3; transition: color .2s ease; }
      .task-meta { display: block; margin-top: 4px; color: #92a198; font-size: 11px; transition: opacity .2s ease; }

      li.done .task-name { color: #a1aea5; text-decoration: line-through; text-decoration-thickness: 1.5px; }
      li.done .task-meta { opacity: .55; }

      .composer {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 20px;
        padding: 9px 10px 9px 15px;
        border: 1px solid #e5ebe8;
        border-radius: 14px;
        background: #fbfcfb;
      }

      #new-task {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: #172126;
        font: inherit;
        font-size: 13px;
      }

      #new-task::placeholder { color: #a1aea5; }
      #new-task:focus { outline: none; }

      .add {
        display: grid;
        flex: 0 0 29px;
        width: 29px;
        height: 29px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: #177953;
        color: #fff;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      .note {
        margin: 17px 0 0;
        color: #a4afa8;
        font-size: 10px;
        line-height: 1.4;
        text-align: center;
      }

      @media (max-width: 480px) {
        body { padding: 0; background: #fff; }
        .panel {
          min-height: 100vh;
          padding: 26px 22px 24px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .check, .task-name, .task-meta { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-label="Buildin task panel demo">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span> Buildin</div>
      <header>
        <div>
          <h1>Today</h1>
          <p class="subtitle">The important things, without the clutter.</p>
        </div>
        <span class="count" id="count"></span>
      </header>
      <ul id="tasks" aria-label="Tasks"></ul>
      <form class="composer" id="add-form">
        <input id="new-task" name="task" placeholder="Add a task..." aria-label="New task" maxlength="100" autocomplete="off" />
        <button class="add" type="submit" aria-label="Add task">+</button>
      </form>
      <p class="note">Interactive prototype · Sample tasks are stored on this device.</p>
    </main>
    <script>
      const STORAGE_KEY = "buildin-task-panel-demo-v1";
      const initialTasks = [
        { id: "parcel", name: "Collect parcel from locker", meta: "Personal", done: false },
        { id: "luggage", name: "Pack my luggage", meta: "Personal", done: false },
        { id: "blog", name: "Write blog post", meta: "Work", done: false },
        { id: "calendar", name: "Plan content calendar", meta: "Work", done: false },
        { id: "video", name: "Film a new video", meta: "Work", done: false },
        { id: "bill", name: "Pay credit card bill", meta: "Personal", done: false }
      ];

      const resetRequested = new URLSearchParams(location.search).get("reset") === "1";
      if (resetRequested) {
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* Storage may be unavailable in an embed. */ }
        const cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete("reset");
        history.replaceState(null, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
      }

      let tasks;
      try {
        const saved = resetRequested ? null : JSON.parse(localStorage.getItem(STORAGE_KEY));
        tasks = Array.isArray(saved) ? saved : structuredClone(initialTasks);
      } catch {
        tasks = structuredClone(initialTasks);
      }
      tasks = tasks.map((task, index) => ({
        ...task,
        order: Number.isInteger(task.order) ? task.order : index,
        completedOrder: task.done ? (Number.isInteger(task.completedOrder) ? task.completedOrder : index) : null
      }));

      const list = document.getElementById("tasks");
      const count = document.getElementById("count");
      const form = document.getElementById("add-form");
      const input = document.getElementById("new-task");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch { /* UI remains usable in restricted embeds. */ }
      }

      function orderedTasks() {
        return [...tasks].sort((a, b) =>
          Number(a.done) - Number(b.done) ||
          (a.done ? a.completedOrder - b.completedOrder : a.order - b.order)
        );
      }

      function createRow(task) {
        const row = document.createElement("li");
        row.dataset.taskId = task.id;
        row.innerHTML = '<button class="check" type="button"><svg aria-hidden="true" viewBox="0 0 18 18" fill="none"><path d="m3.5 9 3.6 3.5L14.5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="task-text"><span class="task-name"></span><span class="task-meta"></span></div>';
        row.addEventListener("click", () => toggleTask(task.id));
        return row;
      }

      function updateRow(row, task) {
        row.classList.toggle("done", task.done);
        const button = row.querySelector(".check");
        button.setAttribute("aria-label", (task.done ? "Mark incomplete: " : "Complete: ") + task.name);
        button.setAttribute("aria-pressed", String(task.done));
        row.querySelector(".task-name").textContent = task.name;
        row.querySelector(".task-meta").textContent = task.meta;
      }

      function render({ animate = false, movedId = null } = {}) {
        const before = new Map([...list.children].map(row => [row.dataset.taskId, row.getBoundingClientRect()]));
        for (const row of list.children) row.getAnimations().forEach(animation => animation.cancel());

        const existing = new Map([...list.children].map(row => [row.dataset.taskId, row]));
        for (const task of orderedTasks()) {
          const row = existing.get(task.id) ?? createRow(task);
          updateRow(row, task);
          list.append(row);
        }

        if (animate && !reducedMotion.matches) {
          for (const row of list.children) {
            const previous = before.get(row.dataset.taskId);
            if (!previous) {
              row.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }],
                { duration: 330, easing: "ease-out" });
              continue;
            }
            const distance = previous.top - row.getBoundingClientRect().top;
            if (Math.abs(distance) < 1) continue;
            const isMoved = row.dataset.taskId === movedId;
            const animation = row.animate([
              { transform: `translateY(${distance}px) scale(${isMoved ? .985 : 1})`, opacity: isMoved ? .78 : 1, offset: 0 },
              { transform: `translateY(${distance}px) scale(1)`, opacity: 1, offset: .14 },
              { transform: "translateY(0) scale(1)", opacity: 1, offset: 1 }
            ], { duration: 480, easing: "cubic-bezier(.22, 1, .36, 1)" });
            if (isMoved) {
              row.style.zIndex = "1";
              animation.addEventListener("finish", () => { row.style.zIndex = ""; }, { once: true });
              animation.addEventListener("cancel", () => { row.style.zIndex = ""; }, { once: true });
            }
          }
        }

        const remaining = tasks.filter(task => !task.done).length;
        count.textContent = `${remaining} left`;
      }

      function toggleTask(id) {
        const task = tasks.find(item => item.id === id);
        if (!task) return;
        const restoreFocus = document.activeElement?.closest("[data-task-id]")?.dataset.taskId === id;
        task.done = !task.done;
        task.completedOrder = task.done
          ? Math.max(0, ...tasks.map(item => item.completedOrder ?? 0)) + 1
          : null;
        save();
        render({ animate: true, movedId: id });
        if (restoreFocus) list.querySelector(`[data-task-id="${CSS.escape(id)}"] .check`)?.focus({ preventScroll: true });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        tasks.push({ id: crypto.randomUUID(), name, meta: "New task", done: false,
          order: Math.max(-1, ...tasks.map(task => task.order)) + 1, completedOrder: null });
        input.value = "";
        save();
        render({ animate: true });
      });

      render();
    </script>
  </body>
</html>
