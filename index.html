<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>My Tasks · Interactive Demo</title>
    <style>
      :root {
        font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #37352f;
        background: #fff;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }
      button, input { font: inherit; }

      .panel {
        width: 100%;
        padding: 0 1px;
        background: #fff;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        font-size: 21px;
        line-height: 1.4;
        font-weight: 650;
        letter-spacing: -.025em;
      }

      .count {
        color: #9b9a97;
        font-size: 13px;
        white-space: nowrap;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 13px;
        min-height: 59px;
        padding: 11px 2px 10px;
        border-bottom: 1px solid #efefed;
        background: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }

      .check {
        display: grid;
        flex: 0 0 19px;
        width: 19px;
        height: 19px;
        place-items: center;
        margin-top: 2px;
        padding: 0;
        border: 1.5px solid #aaa9a4;
        border-radius: 4px;
        background: #fff;
        color: transparent;
        cursor: pointer;
        transition: background .16s ease, border-color .16s ease, transform .16s ease;
      }

      .check:hover { border-color: #2e805e; transform: scale(1.06); }
      .check:focus-visible, .add:focus-visible, .reset:focus-visible, #new-task:focus-visible {
        outline: 2px solid #2e805e;
        outline-offset: 3px;
      }

      .check[aria-pressed="true"] {
        border-color: #2e805e;
        background: #2e805e;
        color: #fff;
      }

      .check svg { width: 14px; height: 14px; }

      .task-text { min-width: 0; }
      .task-name { display: block; font-size: 15px; font-weight: 510; line-height: 1.34; transition: color .2s ease; }
      .task-meta { display: block; margin-top: 3px; color: #9b9a97; font-size: 11px; line-height: 1.3; transition: opacity .2s ease; }

      li.done .task-name { color: #aaa9a4; text-decoration: line-through; text-decoration-thickness: 1px; }
      li.done .task-meta { opacity: .64; }

      .composer {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        padding: 8px 2px;
      }

      #new-task {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: none;
        color: #37352f;
        font-size: 14px;
      }

      #new-task::placeholder { color: #9b9a97; }

      .add {
        display: grid;
        flex: 0 0 19px;
        width: 19px;
        height: 19px;
        place-items: center;
        padding: 0;
        border: 0;
        background: none;
        color: #9b9a97;
        font-size: 24px;
        font-weight: 300;
        line-height: 1;
        cursor: pointer;
      }

      .reset {
        margin-top: 15px;
        padding: 0;
        border: 0;
        background: none;
        color: #aaa9a4;
        font-size: 11px;
        cursor: pointer;
      }

      .reset:hover { color: #64635e; text-decoration: underline; }

      @media (prefers-reduced-motion: reduce) {
        .check, .task-name, .task-meta { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-label="Interactive task list">
      <header>
        <h2 id="section-title"></h2>
        <span class="count" id="count"></span>
      </header>
      <ul id="tasks" aria-label="Tasks"></ul>
      <form class="composer" id="add-form">
        <button class="add" type="submit" aria-label="Add task">+</button>
        <input id="new-task" name="task" aria-label="New task" maxlength="100" autocomplete="off" />
      </form>
      <button class="reset" id="reset-demo" type="button"></button>
    </main>
    <script>
      const searchParams = new URLSearchParams(location.search);
      const locale = searchParams.get("lang") === "ru" ? "ru" : "en";
      const copy = {
        en: {
          title: "My Tasks · Interactive Demo",
          panel: "Interactive task list",
          today: "Today",
          tasksLabel: "Tasks",
          addTask: "Add task",
          newTask: "New task",
          addPlaceholder: "Add a task...",
          reset: "Reset demo",
          remaining: count => `${count} remaining`,
          complete: "Complete: ",
          incomplete: "Mark incomplete: ",
          newMeta: "New task",
          tasks: [
            { id: "parcel", name: "Collect parcel from locker", meta: "Personal" },
            { id: "luggage", name: "Pack my luggage", meta: "Personal" },
            { id: "blog", name: "Write blog post", meta: "Work" },
            { id: "calendar", name: "Plan content calendar", meta: "Work" },
            { id: "video", name: "Film a new video", meta: "Work" },
            { id: "bill", name: "Pay credit card bill", meta: "Personal" }
          ]
        },
        ru: {
          title: "Мои задачи · интерактивное демо",
          panel: "Интерактивный список задач",
          today: "Сегодня",
          tasksLabel: "Задачи",
          addTask: "Добавить задачу",
          newTask: "Новая задача",
          addPlaceholder: "Добавить задачу...",
          reset: "Сбросить демо",
          remaining: count => `Осталось: ${count}`,
          complete: "Выполнить: ",
          incomplete: "Вернуть в список: ",
          newMeta: "Новая задача",
          tasks: [
            { id: "parcel", name: "Забрать посылку из постамата", meta: "Личное" },
            { id: "luggage", name: "Собрать чемодан", meta: "Личное" },
            { id: "blog", name: "Написать статью для блога", meta: "Работа" },
            { id: "calendar", name: "Составить контент-план", meta: "Работа" },
            { id: "video", name: "Снять новое видео", meta: "Работа" },
            { id: "bill", name: "Оплатить счёт по кредитной карте", meta: "Личное" }
          ]
        }
      }[locale];
      const STORAGE_KEY = locale === "ru" ? "buildin-task-panel-demo-ru-v1" : "buildin-task-panel-demo-v1";
      const initialTasks = copy.tasks.map(task => ({ ...task, done: false }));

      document.documentElement.lang = locale;
      document.title = copy.title;
      document.querySelector("main").setAttribute("aria-label", copy.panel);
      document.getElementById("section-title").textContent = copy.today;
      document.getElementById("tasks").setAttribute("aria-label", copy.tasksLabel);
      document.querySelector(".add").setAttribute("aria-label", copy.addTask);
      document.getElementById("new-task").setAttribute("aria-label", copy.newTask);
      document.getElementById("new-task").placeholder = copy.addPlaceholder;
      document.getElementById("reset-demo").textContent = copy.reset;

      const resetRequested = searchParams.get("reset") === "1";
      if (resetRequested) {
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* Storage may be unavailable in an embed. */ }
        const cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete("reset");
        history.replaceState(null, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
      }

      let tasks;
      try {
        const saved = resetRequested ? null : JSON.parse(localStorage.getItem(STORAGE_KEY));
        tasks = Array.isArray(saved) ? saved : structuredClone(initialTasks);
      } catch {
        tasks = structuredClone(initialTasks);
      }
      tasks = tasks.map((task, index) => ({
        ...task,
        order: Number.isInteger(task.order) ? task.order : index,
        completedOrder: task.done ? (Number.isInteger(task.completedOrder) ? task.completedOrder : index) : null
      }));

      const list = document.getElementById("tasks");
      const count = document.getElementById("count");
      const form = document.getElementById("add-form");
      const input = document.getElementById("new-task");
      const resetButton = document.getElementById("reset-demo");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch { /* UI remains usable in restricted embeds. */ }
      }

      function orderedTasks() {
        return [...tasks].sort((a, b) =>
          Number(a.done) - Number(b.done) ||
          (a.done ? a.completedOrder - b.completedOrder : a.order - b.order)
        );
      }

      function createRow(task) {
        const row = document.createElement("li");
        row.dataset.taskId = task.id;
        row.innerHTML = '<button class="check" type="button"><svg aria-hidden="true" viewBox="0 0 18 18" fill="none"><path d="m3.5 9 3.6 3.5L14.5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="task-text"><span class="task-name"></span><span class="task-meta"></span></div>';
        row.addEventListener("click", () => toggleTask(task.id));
        return row;
      }

      function updateRow(row, task) {
        row.classList.toggle("done", task.done);
        const button = row.querySelector(".check");
        button.setAttribute("aria-label", (task.done ? copy.incomplete : copy.complete) + task.name);
        button.setAttribute("aria-pressed", String(task.done));
        row.querySelector(".task-name").textContent = task.name;
        row.querySelector(".task-meta").textContent = task.meta;
      }

      function render({ animate = false, movedId = null } = {}) {
        const before = new Map([...list.children].map(row => [row.dataset.taskId, row.getBoundingClientRect()]));
        for (const row of list.children) row.getAnimations().forEach(animation => animation.cancel());

        const existing = new Map([...list.children].map(row => [row.dataset.taskId, row]));
        for (const task of orderedTasks()) {
          const row = existing.get(task.id) ?? createRow(task);
          updateRow(row, task);
          list.append(row);
        }

        if (animate && !reducedMotion.matches) {
          for (const row of list.children) {
            const previous = before.get(row.dataset.taskId);
            if (!previous) {
              row.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }],
                { duration: 330, easing: "ease-out" });
              continue;
            }
            const distance = previous.top - row.getBoundingClientRect().top;
            if (Math.abs(distance) < 1) continue;
            const isMoved = row.dataset.taskId === movedId;
            const animation = row.animate([
              { transform: `translateY(${distance}px) scale(${isMoved ? .985 : 1})`, opacity: isMoved ? .78 : 1, offset: 0 },
              { transform: `translateY(${distance}px) scale(1)`, opacity: 1, offset: .14 },
              { transform: "translateY(0) scale(1)", opacity: 1, offset: 1 }
            ], { duration: 480, easing: "cubic-bezier(.22, 1, .36, 1)" });
            if (isMoved) {
              row.style.zIndex = "1";
              animation.addEventListener("finish", () => { row.style.zIndex = ""; }, { once: true });
              animation.addEventListener("cancel", () => { row.style.zIndex = ""; }, { once: true });
            }
          }
        }

        const remaining = tasks.filter(task => !task.done).length;
        count.textContent = copy.remaining(remaining);
      }

      function toggleTask(id) {
        const task = tasks.find(item => item.id === id);
        if (!task) return;
        const restoreFocus = document.activeElement?.closest("[data-task-id]")?.dataset.taskId === id;
        task.done = !task.done;
        task.completedOrder = task.done
          ? Math.max(0, ...tasks.map(item => item.completedOrder ?? 0)) + 1
          : null;
        save();
        render({ animate: true, movedId: id });
        if (restoreFocus) list.querySelector(`[data-task-id="${CSS.escape(id)}"] .check`)?.focus({ preventScroll: true });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        tasks.push({ id: crypto.randomUUID(), name, meta: copy.newMeta, done: false,
          order: Math.max(-1, ...tasks.map(task => task.order)) + 1, completedOrder: null });
        input.value = "";
        save();
        render({ animate: true });
      });

      resetButton.addEventListener("click", () => {
        const url = new URL(location.href);
        url.searchParams.set("reset", "1");
        location.assign(url);
      });

      render();
    </script>
  </body>
</html>
